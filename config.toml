# MuReader configuration.
#
# Default location:
#   $XDG_CONFIG_HOME/mureader/config.toml
#   (~/.config/mureader/config.toml)
#
# Set MUREADER_CONFIG to use a different file.

[animation]
# Page-turn slide duration in milliseconds.
page_turn_ms = 320
# Delay before re-rendering after window resize; the old page is scaled
# immediately while dragging.
window_fit_ms = 120

[reflowable]
# Per-document styles are not configured here. On first open MuReader writes a
# sidecar stylesheet at
#   $XDG_DATA_HOME/mureader/css/<sha256>.css
# and you edit that file from then on. MUREADER_CSS_DIR overrides the
# directory. See README.md for the sidecar marker, theme tokens, and migration
# from the old css, css_file, and [perfect_palette] options.

# Read plain-text files with Unicode line breaking and a total-fit pass.
# MuPDF provides the handlers for txt and text files; formats without a MuPDF
# handler are not opened.
pretty = true

[progress]
# Number of documents whose last-read page is remembered. New entries
# replace the oldest one. Set to 0 to disable reading progress.
max_documents = 100

[keys]
# Each binding is a key sequence; put spaces between sequence steps.
# Multiple bindings for one action use an array.
# Modifiers: C- (Control), M- (Alt), S- (Shift).
quit = ["q", "Q", "Escape"]
next_page = "n"
prev_page = "p"
first_page = ["g", "Home", "M-<"]
last_page = ["G", "End", "M->"]
back = ["M-Left", "M-h"]
forward = ["M-Right", "M-l"]
scroll_down = ["PageDown", "Space", "C-n"]
scroll_up = ["PageUp", "S-Space", "Delete", "C-p"]
scroll_line_down = "Down"
scroll_line_up = "Up"
scroll_down_screen = "C-v"
scroll_up_screen = "M-v"
scroll_left = ["Left", "C-b"]
scroll_right = ["Right", "C-f"]
scroll_left_most = "C-a"
scroll_right_most = "C-e"
outline = "o"
search_page = "C-s"
search_book = "M-s"
zoom_in = "+"
zoom_out = "-"
font_increase = "C-="
font_decrease = "C--"
reset_view = "0"
# Reading modes: the two-page spread is paged; otherwise single-column
# continuous scroll. Page numbers are shared across the two modes.
toggle_spread = "s"
rotate_right = "r"
rotate_left = "l"
copy = ["M-w", "C-w"]
