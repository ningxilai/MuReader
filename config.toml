# MuReader configuration.
#
# Default location:
#   $XDG_CONFIG_HOME/mureader/config.toml
#   (~/.config/mureader/config.toml)
#
# Set MUREADER_CONFIG to use a different file.

[animation]
# Page-turn slide duration in milliseconds.
page_turn_ms = 320
# Delay before re-rendering after window resize; the old page is scaled
# immediately while dragging.
window_fit_ms = 120

[reflowable]
# Custom CSS for reflowable documents (EPUB, HTML, TXT, FB2, MOBI, DOCX, ...).
# Use !important where the document's own CSS should be overridden.
#
# The first font-family declared here is also used by the outline, prompts,
# and other UI text. Missing glyphs (CJK, emoji, symbols) share the same
# fallback chain, so there is no separate [fonts] section.
#
# The same CSS drives every non-reading color: the outline, command panel,
# prompts, loading card, borders, and selection highlights. The effective
# background/background-color and color on body, html, or :root set the base
# surface and text, and all panel shades are derived from them. Optional
# custom properties override individual parts:
#
#   --mureader-background     window behind the page
#   --mureader-surface        outline, command panel, and prompt surface
#   --mureader-text           primary UI text
#   --mureader-muted          secondary UI text
#   --mureader-accent         selection rails and accent text
#   --mureader-border         panel borders
#   --mureader-search         search-highlight color
#   --mureader-selection      text-selection color
#   --mureader-selected-text  selected outline/menu text
#
# Without CSS colors the UI follows the document: it starts from the HTML
# default white canvas and dark text, then tracks the rendered page background
# as pages arrive. CSS that only sets a font therefore changes nothing about
# the palette.
#
# css = """
# :root {
#     --mureader-background: #1b1b1b;
#     --mureader-surface: #242424;
#     --mureader-text: #e8e2d8;
#     --mureader-accent: #d7a45e;
# }
# body {
#     font-family: "Noto Serif", "Droid Sans Fallback Full", sans-serif;
# }
# """
css = ""
# Optional CSS file, applied after the inline CSS. Relative paths are resolved
# against this config file's directory.
css_file = ""

# Read plain-text files with Unicode line breaking and a total-fit pass.
# MuPDF provides the handlers for txt and text files; formats without a MuPDF
# handler are not opened.
pretty = true

[perfect_palette]
# Optional eye-comfort palette ported from the HPLuv helper in the Emacs
# configuration. It tints reflowable pages and colors the UI accent, search,
# and selection through the same [reflowable] CSS. User CSS below wins.
enable = false
# Number of colors, hue step, and starting hue fraction (p, q, hue-start).
colors = 9
step = 4
hue_start = 0.58
# Saturation and lightness in percent. Lightness below 50 picks a dark page.
saturation = 45
lightness = 65
# Use HPLuv (true) or ordinary HSL (false).
hpluv = true

[progress]
# Number of documents whose last-read page is remembered. New entries
# replace the oldest one. Set to 0 to disable reading progress.
max_documents = 100

[keys]
# Each binding is a key sequence; put spaces between sequence steps.
# Multiple bindings for one action use an array.
# Modifiers: C- (Control), M- (Alt), S- (Shift).
quit = ["q", "Q", "Escape"]
next_page = "n"
prev_page = "p"
first_page = ["g", "Home", "M-<"]
last_page = ["G", "End", "M->"]
back = ["M-Left", "M-h"]
forward = ["M-Right", "M-l"]
scroll_down = ["Down", "PageDown", "Space", "C-n"]
scroll_up = ["Up", "PageUp", "S-Space", "Delete", "C-p"]
scroll_down_screen = "C-v"
scroll_up_screen = "M-v"
scroll_left = ["Left", "C-b"]
scroll_right = ["Right", "C-f"]
scroll_left_most = "C-a"
scroll_right_most = "C-e"
outline = "o"
search_page = "C-s"
search_book = "M-s"
zoom_in = "+"
zoom_out = "-"
font_increase = "C-="
font_decrease = "C--"
reset_view = "0"
toggle_spread = "s"
rotate_right = "r"
rotate_left = "l"
copy = ["M-w", "C-w"]
