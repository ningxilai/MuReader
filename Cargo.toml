[package]
name = "mureader"
version = "0.1.0"
edition = "2021"
authors = ["Lee <loyalpartner@163.com>"]
license = "AGPL-3.0"
repository = "https://github.com/ningxilai/MuReader"
description = "MuReader: standalone MuPDF document reader"


[dependencies]
ab_glyph = "0.2"
fontdb = "0.24"
harfbuzz_rs = "2"
hypher = "0.1"
libc = "0.2"
mupdf = { git = "https://github.com/ningxilai/mupdf-rs", branch = "main", default-features = false, features = [
    "epub",
    "cbz",
    "xps",
    "svg",
    "img",
    "html",
    "system-fonts",
    "base14-fonts",
    "brotli",
] }
mupdf-fonts-droid = "0.8"
mupdf-fonts-noto = "0.8"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
softbuffer = "0.4"
toml = "0.8"
unicode-bidi = "0.3"
unicode-bidi-mirroring = "0.4"
unicode-linebreak = "0.1"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
winit = "0.30"

[profile.release]
lto = true
